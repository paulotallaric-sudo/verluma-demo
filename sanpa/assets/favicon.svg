<!-- Favicon SANPA : lettre « A » remplie avec le dégradé signature du logo -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <!-- Dégradé vert → turquoise → bleu (identique à --degrade-accent en CSS) -->
    <linearGradient id="degrade-sanpa" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#35D07F"/>
      <stop offset="50%" stop-color="#24D6C4"/>
      <stop offset="100%" stop-color="#3B82F6"/>
    </linearGradient>
  </defs>
  <!-- Fond sombre arrondi -->
  <rect width="64" height="64" rx="14" fill="#0A0A0B"/>
  <!-- Lettre A -->
  <text x="32" y="46" text-anchor="middle" font-family="Arial, Helvetica, sans-serif"
        font-size="40" font-weight="900" fill="url(#degrade-sanpa)">A</text>
</svg>
